[project]
name = "dropzone"
version = "0.1.0"
description = "A tool-calling geography survival game"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "astral>=3.2",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.57",
    "google-genai>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
